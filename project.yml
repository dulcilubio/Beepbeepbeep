name: startclock
options:
  bundleIdPrefix: se.erikfrick
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: se.erikfrick.startclock
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"         # iPhone + iPad
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    INFOPLIST_FILE: startclock/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: 83NLQQ5KF5
    CODE_SIGN_STYLE: Automatic
    # Version lives here — Info.plist only references these. Bump
    # MARKETING_VERSION for a release users see, CURRENT_PROJECT_VERSION for
    # every upload (App Store Connect requires it to be unique per version).
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"

targets:
  startclock:
    type: application
    platform: iOS
    sources:
      - path: startclock
    info:
      path: startclock/Info.plist
      properties:
        # Reference the build settings above so the version has one home.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "startclock uses GPS to synchronise time. No location data is stored or transmitted."
        UIApplicationSupportsIndirectInputEvents: YES
        UIBackgroundModes:
          - audio
    scheme:
      testTargets:
        - startclockTests

  startclockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: startclockTests
    dependencies:
      - target: startclock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.erikfrick.startclock.tests
        # The app's Info.plist must not be inherited by the test bundle.
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
