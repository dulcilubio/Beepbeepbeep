name: startclock
options:
  bundleIdPrefix: se.erikfrick
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: se.erikfrick.startclock
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"         # iPhone + iPad
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    INFOPLIST_FILE: startclock/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: 83NLQQ5KF5
    CODE_SIGN_STYLE: Automatic

targets:
  startclock:
    type: application
    platform: iOS
    sources:
      - path: startclock
    info:
      path: startclock/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "startclock uses GPS to synchronise time. No location data is stored or transmitted."
        UIApplicationSupportsIndirectInputEvents: YES
        UIBackgroundModes:
          - audio
